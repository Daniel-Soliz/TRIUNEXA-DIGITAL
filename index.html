<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRUINEXA DIGITAL — CRM Interno de Prospecção e Vendas</title>
    <meta name="description" content="Plataforma interna exclusiva da TRUINEXA DIGITAL para gestão de leads, funil Kanban, atendimento via WhatsApp, agenda comercial e fechamento de contratos." />
    <meta property="og:title" content="TRUINEXA DIGITAL — CRM Interno" />
    <meta property="og:description" content="CRM Interno de Prospecção, Atendimento e Vendas da TRUINEXA DIGITAL." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TRUINEXA" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/truinexa-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/truinexa-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-slate-200 selection:text-slate-900">
    <div id="root">
      <div id="truinexa-boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;font-family:Inter,Arial,sans-serif;padding:24px;box-sizing:border-box">
        <div style="width:100%;max-width:440px;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:32px;box-shadow:0 20px 45px rgba(15,23,42,.08)">
          <img src="%BASE_URL%icons/truinexa-192.png" alt="TRUINEXA" style="width:52px;height:52px;border-radius:15px;object-fit:cover;margin-bottom:20px;box-shadow:0 8px 24px rgba(2,132,199,.20)" />
          <div style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#475569">TRUINEXA DIGITAL</div>
          <h1 style="font-size:24px;line-height:1.2;margin:8px 0 10px">Carregando CRM...</h1>
          <p style="font-size:14px;line-height:1.6;color:#64748b;margin:0">Preparando seu ambiente comercial seguro.</p>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function () {
        var root = document.getElementById('root');
        if (!root) return;
        setTimeout(function () {
          if (document.getElementById('truinexa-boot')) {
            root.innerHTML =
              '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif;padding:24px;box-sizing:border-box">' +
              '<div style="width:100%;max-width:520px;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:32px;box-shadow:0 20px 45px rgba(15,23,42,.08)">' +
              '<strong style="font-size:20px">TRUINEXA DIGITAL</strong>' +
              '<p style="color:#64748b;line-height:1.6">O aplicativo não conseguiu iniciar. Atualize a página em alguns segundos. Se continuar, a publicação do GitHub Pages ainda está sendo concluída.</p>' +
              '<button onclick="location.reload()" style="border:0;border-radius:12px;background:#0f172a;color:white;padding:12px 18px;font-weight:700;cursor:pointer">Tentar novamente</button>' +
              '</div></div>';
          }
        }, 700);
      });
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
